<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سازندهٔ مدل مرد — MakeHuman JS</title>
<style>
  body{margin:0;background:#151810;color:#e6ead1;font:15px system-ui,sans-serif;display:grid;grid-template-columns:290px 1fr;min-height:100vh}aside{padding:22px;background:#252b1d;border-left:1px solid #59633c}h1{font-size:20px;margin-top:0}label{display:block;margin:18px 0 6px}input{width:100%}button{margin-top:18px;width:100%;border:0;border-radius:6px;padding:11px;background:#aab668;color:#17200f;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#view{width:100%;height:100vh;display:block}small,#status{display:block;color:#c3caa0;line-height:1.7;margin-top:14px}.warn{color:#e4c483}
</style>
<aside>
  <h1>سازندهٔ مدل مرد</h1>
  <small>این ابزار توسعه از makehuman-js با مجوز AGPL-3.0 استفاده می‌کند. خروجی OBJ برای Auto-Rig در Mixamo است؛ خود بازی فایل Three.js قدیمی را بارگذاری نمی‌کند.</small>
  <label>قد <output id="heightOut">50</output></label><input id="height" type="range" min="20" max="85" value="50">
  <label>وزن <output id="weightOut">50</output></label><input id="weight" type="range" min="20" max="85" value="50">
  <label>سن <output id="ageOut">34</output></label><input id="age" type="range" min="18" max="60" value="34">
  <label>رنگ پوست</label><input id="skin" type="color" value="#b77d60">
  <button id="download" disabled>دانلود OBJ برای Mixamo</button>
  <div id="status">در حال بارگذاری پایهٔ MakeHuman…</div>
  <small class="warn">این صفحه باید از طریق سرور محلی باز شود، نه با دوبارکلیک روی فایل.</small>
</aside>
<canvas id="view"></canvas>
<script src="../cache/three-r82.min.js"></script>
<script src="../cache/makehuman-js-package-complete/package/dist/makehuman.min.js"></script>
<script>
(function(){
  'use strict';
  var canvas=document.getElementById('view'),status=document.getElementById('status');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0x151810);
  var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100);
  camera.position.set(0,1.35,3.1); scene.add(new THREE.HemisphereLight(0xe6ead1,0x33331f,1.4));
  var key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(3,5,4);scene.add(key);
  var floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,48),new THREE.MeshPhongMaterial({color:0x59633c}));floor.rotation.x=-Math.PI/2;scene.add(floor);
  var human=null;
  function resize(){renderer.setSize(innerWidth-290,innerHeight);camera.aspect=(innerWidth-290)/innerHeight;camera.updateProjectionMatrix();}
  addEventListener('resize',resize);resize();
  function render(){requestAnimationFrame(render);if(human){human.rotation.y+=.003;}renderer.render(scene,camera);}render();
  function update(){
    if(!human)return;
    human.factors.setGender(1);
    human.factors.setHeight(Number(height.value)/100);
    human.factors.setWeight(Number(weight.value)/100);
    human.factors.setAgeYears(Number(age.value));
    human.targets.applyTargets(); human.onElementsNeedUpdate();
    var material=human.mesh.material.materials[0];if(material&&material.color)material.color.set(skin.value);
    heightOut.value=height.value;weightOut.value=weight.value;ageOut.value=age.value;
  }
  [height,weight,age,skin].forEach(function(input){input.addEventListener('input',update);});
  function obj(mesh){
    var lines=['# Generated with makehuman-js 0.1.3 (AGPL-3.0)','o VardanMaleBase'];
    mesh.geometry.vertices.forEach(function(v){lines.push('v '+v.x.toFixed(6)+' '+v.y.toFixed(6)+' '+v.z.toFixed(6));});
    mesh.geometry.faces.forEach(function(f){lines.push('f '+(f.a+1)+' '+(f.b+1)+' '+(f.c+1));});
    return lines.join('\n')+'\n';
  }
  download.addEventListener('click',function(){
    var blob=new Blob([obj(human.mesh)],{type:'text/plain'}),link=document.createElement('a');
    link.href=URL.createObjectURL(blob);link.download='vardan-male-base.obj';link.click();setTimeout(function(){URL.revokeObjectURL(link.href);},1000);
  });
  try{
    human=new makehuman.Human({baseUrl:'../cache/makehuman-data-package/package/public/data/',model:'human_full_size.json',defaultSkin:'middleage_caucasian_male/middleage_caucasian_male.json'});
    Promise.all([human.loadModel(),human.loadTargets()]).then(function(){scene.add(human);update();download.disabled=false;status.textContent='آماده است؛ تنظیم کن و OBJ را دانلود کن.';}).catch(function(error){status.textContent='خطا در بارگذاری داده: '+error.message;console.error(error);});
  }catch(error){status.textContent='خطا در راه‌اندازی MakeHuman: '+error.message;console.error(error);}
})();
</script>
